[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
via_ir = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./" }]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[profile.ci.fuzz]
runs = 1000
